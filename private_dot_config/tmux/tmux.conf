# ~/.config/tmux/tmux.conf — managed by chezmoi
# Reload inside tmux: prefix + r

# ---- Terminal / colors ------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"      # truecolor passthrough
set -s escape-time 10                   # don't delay Esc (vim, copy-mode)
set -g focus-events on                  # let vim/editors see focus changes

# Always start zsh in new panes, regardless of which shell launched the server
if-shell "test -x /usr/bin/zsh" "set -g default-shell /usr/bin/zsh"

# ---- Prefix: Ctrl-a ---------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- Behavior ---------------------------------------------------------------
setw -g mode-keys vi
set -g history-limit 100000
set -g mouse off                        # prefix+m / prefix+M to toggle
set -g renumber-windows on              # keep window numbers gapless
set -g base-index 1
setw -g pane-base-index 1

# Forward OSC 52 clipboard writes from apps inside tmux (e.g. Claude Code)
# to the outer terminal. The default "external" silently drops them.
set -g set-clipboard on

# ---- Status line: session + host, so nested ssh stays legible ---------------
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bold] #S #[default]| "
set -g status-left-length 30
set -g status-right "#[bold]#H #[default]%H:%M "
setw -g window-status-current-style "bold fg=colour214"

# ---- Keybindings ------------------------------------------------------------
# Reload config quickly
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Vim-like pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Easier scrollback and splits (QWERTZ-friendly); new panes keep the cwd
unbind s
bind s copy-mode
bind S choose-tree -Zs
bind b split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Easier resizing with prefix + H/J/K/L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Copy mode like vim
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Toggle mouse on/off quickly
bind m set -g mouse on \; display-message "mouse: on"
bind M set -g mouse off \; display-message "mouse: off"

# ---- QWERTZ-friendly replacements for bracket/brace/tilde defaults ---------
# Defaults needing AltGr on a German layout: ] paste, { } swap panes, ~ messages
bind p paste-buffer                      # was ]  (previous-window -> Shift-Left)
bind '<' swap-pane -U                    # was {  (< is a dedicated key on QWERTZ)
bind '>' swap-pane -D                    # was }
bind Tab last-window                     # was l  (l is now pane-right)
bind ö show-messages                     # was ~
bind ä choose-buffer                     # was =  (paste from history)

# ---- No-prefix navigation ---------------------------------------------------
bind -n M-Left  select-pane -L           # Alt+arrows: move between panes
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R
bind -n S-Left  previous-window          # Shift+arrows: switch windows
bind -n S-Right next-window
bind -n M-1 select-window -t 1           # Alt+number: jump to window
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
