# Starship prompt — kept close to defaults, tuned for ssh/tmux/container work.

# Timestamp first, then everything else in default order
format = "$time$all"

[time]
disabled = false
format = "[$time]($style) "
time_format = "%H:%M:%S"
style = "dimmed"

# Always show the hostname (you are constantly on remote machines/containers)
[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "bold dimmed green"

[directory]
truncation_length = 4
truncate_to_repo = true

[python]
disabled = true

[pixi]
# env name only (when a pixi env is active), no icon/version
format = '[($environment )]($style)'

[git_status]
# faster in big repos; counts are still shown
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[cmd_duration]
min_time = 2000

# Trim noise
[package]
disabled = true
