# Easier prefix: Ctrl-a instead of Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Use vim-style keys in copy mode

setw -g mode-keys vi

# Better history
set -g history-limit 100000

# Mouse support (you can turn this off if it annoys VS Code selection)
set -g mouse off

# Forward OSC 52 clipboard writes from apps inside tmux (e.g. Claude Code)
# to the outer terminal. The default "external" silently drops them.
set -g set-clipboard on

# Reload config quickly
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Vim-like pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Easier scrollback and splits (QWERTZ-friendly)
unbind s
bind s copy-mode
bind S choose-tree -Zs
bind b split-window -v
bind v split-window -h

# Easier resizing with prefix + H/J/K/L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Copy mode like vim
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Optional: make Escape leave copy mode
bind -T copy-mode-vi Escape send -X cancel

# Optional: toggle mouse on/off quickly
bind m set -g mouse on \; display-message "mouse: on"
bind M set -g mouse off \; display-message "mouse: off"
